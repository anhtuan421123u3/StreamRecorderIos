name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project & Archive iOS App
        working-directory: StreamAppIos
        run: |
          # Temporarily move Package.swift so xcodebuild uses the generated .xcodeproj cleanly
          mv Package.swift Package.swift.spm

          xcodegen generate

          xcodebuild clean archive \
            -project LiveVault.xcodeproj \
            -scheme LiveVault \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LiveVault.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package & Ad-Hoc Sign IPA
        working-directory: StreamAppIos
        run: |
          rm -rf build/Payload build/LiveVault-iOS.ipa
          mkdir -p build/Payload
          cp -R build/LiveVault.xcarchive/Products/Applications/LiveVault.app build/Payload/

          # Ad-hoc sign bundle for Sideloadly / AltStore / SideStore / TrollStore / ESign / Feather
          codesign --force --deep --sign - build/Payload/LiveVault.app

          cd build
          zip -r9 LiveVault-iOS.ipa Payload
          ls -lh LiveVault-iOS.ipa

      - name: Upload IPA Artifact (Download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: LiveVault-iOS-IPA
          path: StreamAppIos/build/LiveVault-iOS.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StreamAppIos/build/LiveVault-iOS.ipa
          generate_release_notes: true
