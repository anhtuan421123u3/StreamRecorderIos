name: Build iOS IPA (Kotlin Multiplatform)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build StreamRecorder IPA (KMP + Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Kotlin Multiplatform
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin Multiplatform iOS Release Framework (iosArm64)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Ensure XcodeGen is installed
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project & Archive iOS App
        working-directory: iosApp
        run: |
          set -o pipefail
          mkdir -p build
          xcodegen generate

          xcodebuild clean archive \
            -project StreamRecorder.xcodeproj \
            -scheme StreamRecorder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StreamRecorder.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build/xcodebuild.log

      - name: Print Build Errors to Summary (on failure)
        if: failure()
        working-directory: iosApp
        run: |
          if [ -f build/xcodebuild.log ]; then
            echo "### Xcode Build Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E ": error:|fatal error:|ARCHIVE FAILED|ld:" build/xcodebuild.log | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package & Ad-Hoc Sign StreamRecorder IPA
        working-directory: iosApp
        run: |
          rm -rf build/Payload build/StreamRecorder-iOS.ipa
          mkdir -p build/Payload
          cp -R build/StreamRecorder.xcarchive/Products/Applications/StreamRecorder.app build/Payload/

          # Ad-hoc sign for Sideloadly / AltStore / SideStore / TrollStore / ESign / Feather
          codesign --force --deep --sign - build/Payload/StreamRecorder.app

          cd build
          zip -r9 StreamRecorder-iOS.ipa Payload
          ls -lh StreamRecorder-iOS.ipa

      - name: Upload StreamRecorder IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamRecorder-iOS-IPA
          path: iosApp/build/StreamRecorder-iOS.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iosApp/build/StreamRecorder-iOS.ipa
          generate_release_notes: true
