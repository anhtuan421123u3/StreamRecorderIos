stages:
  - build

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"

build_streamrecorder_ipa:
  stage: build
  tags:
    - saas-macos-medium-m1
  script:
    - xcodebuild -version
    - |
      if ! command -v java >/dev/null 2>&1; then
        brew install openjdk@21
        export PATH="/opt/homebrew/opt/openjdk@21/bin:$PATH"
      fi
    - |
      if ! command -v xcodegen >/dev/null 2>&1; then
        brew install xcodegen
      fi
    - chmod +x gradlew
    - ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon
    - cd iosApp
    - mkdir -p build
    - xcodegen generate
    - |
      xcodebuild clean archive \
        -project StreamRecorder.xcodeproj \
        -scheme StreamRecorder \
        -configuration Release \
        -destination "generic/platform=iOS" \
        -archivePath build/StreamRecorder.xcarchive \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGN_ENTITLEMENTS="" \
        AD_HOC_CODE_SIGNING_ALLOWED=YES
    - |
      APP="build/StreamRecorder.xcarchive/Products/Applications/StreamRecorder.app"
      plutil -p "$APP/Info.plist"
      plutil -extract CADisableMinimumFrameDurationOnPhone raw "$APP/Info.plist" | grep -q true
    - mkdir -p build/Payload
    - cp -R build/StreamRecorder.xcarchive/Products/Applications/StreamRecorder.app build/Payload/
    - codesign --force --deep --sign - build/Payload/StreamRecorder.app
    - cd build && zip -r9 StreamRecorder-iOS.ipa Payload
  artifacts:
    name: "StreamRecorder-iOS-IPA-$CI_COMMIT_SHORT_SHA"
    paths:
      - iosApp/build/StreamRecorder-iOS.ipa
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
