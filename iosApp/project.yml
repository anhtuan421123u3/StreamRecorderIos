name: StreamRecorder
options:
  bundleIdPrefix: io.streamrecorder
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  StreamRecorder:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StreamRecorder
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.streamrecorder.ios
        PRODUCT_NAME: StreamRecorder
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
          - "$(PROJECT_DIR)/../composeApp/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "IOSurface"
          - "-lc++"
          - "-lsqlite3"
    preBuildScripts:
      - name: Compile Kotlin Multiplatform Framework
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          if [ -n "$CI" ] && [ -d "$SRCROOT/../composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework" ]; then
            echo "Using prebuilt CI ComposeApp.framework"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

schemes:
  StreamRecorder:
    build:
      targets:
        StreamRecorder: all
    archive:
      config: Release
